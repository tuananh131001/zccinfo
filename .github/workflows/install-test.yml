name: Install Method Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-install-script:
    name: Test install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest release has assets
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_COUNT=$(gh release view --repo ${{ github.repository }} --json assets --jq '.assets | length' 2>/dev/null || echo "0")
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Latest release has no assets — skipping install.sh test"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run install.sh (default directory)
        if: steps.check-release.outputs.skip != 'true'
        run: sh install.sh

      - name: Verify default install
        if: steps.check-release.outputs.skip != 'true'
        run: |
          test -x "$HOME/.local/bin/zccinfo"
          echo '{}' | "$HOME/.local/bin/zccinfo" || true

      - name: Run install.sh (custom directory)
        if: steps.check-release.outputs.skip != 'true'
        env:
          INSTALL_DIR: /tmp/custom-install
        run: sh install.sh

      - name: Verify custom install
        if: steps.check-release.outputs.skip != 'true'
        run: |
          test -x /tmp/custom-install/zccinfo
          echo '{}' | /tmp/custom-install/zccinfo || true

  test-nix-build:
    name: Test Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build with Nix
        run: nix build .#zccinfo

      - name: Verify Nix build
        run: |
          test -x ./result/bin/zccinfo
          echo '{}' | ./result/bin/zccinfo || true

      - name: Check flake
        run: nix flake check
